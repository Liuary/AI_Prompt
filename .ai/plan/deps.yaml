# ============================================================================
# 阶段依赖配置
#
# 定义各计划阶段的依赖关系与完成判定标准。
# 完成判定：阶段状态为 "done" 或 "review_passed" 均视为已完成。
# ============================================================================

# 依赖类型：
#   hard       — 语义依赖，前一阶段产出是后一阶段输入，必须串行
#   soft       — 弱依赖，可并行但合并时需人工确认对齐
#   mutual_exclusion — 修改同一文件集，必须严格串行

# 判断规则：
#   - 某阶段所有 hard 依赖的状态为 done 或 review_passed 时，该阶段可启动
#   - soft 依赖未满足时标记警告但可并行启动
#   - mutual_exclusion 的阶段严格按拓扑顺序串行

stages:
  stage-01:
    title: "约束引擎 + 记忆系统"
    depends_on: []
    # 基础阶段，无依赖，可立即启动

  stage-02:
    title: "多人协作基础"
    depends_on:
      - stage: stage-01
        reason: "依赖 stage-01 的 DSL 结构定义和 Instructions 框架"
        type: hard

  stage-03:
    title: "多工具适配扩展"
    depends_on:
      - stage: stage-01
        reason: "依赖 deploy.py 基架和核心层结构"
        type: soft
      - stage: stage-02
        reason: "共享 AGENTS.md / Instructions 内容，可能冲突"
        type: mutual_exclusion

  stage-04:
    title: "规范体系整理"
    depends_on: []
    # 独立阶段（创建 specs/ 目录），可与 stage-02/stage-03 并行

  stage-05:
    title: "审查闭环与工作区清理"
    depends_on:
      - stage: stage-01
        reason: "依赖完整的 Agent 角色体系和工作区结构"
        type: hard
      - stage: stage-02
        reason: "依赖 task_claim.md 🔒 锁定机制（用于并行安全）"
        type: hard

  stage-08:
    title: "多模型后端解耦"
    depends_on:
      - stage: stage-01
        reason: "依赖完整的 Agent 角色体系和工作区结构"
        type: hard
      - stage: stage-05
        reason: "依赖完整的部署框架和计划体系"
        type: soft
    # 模型配置与 Agent 解耦独立模块

# 并行示例：
#   启动条件：stage-01 完成（done 或 review_passed）
#   可并行阶段：stage-02(hard依赖满足) + stage-04(无依赖)
#   stage-03 与 stage-02 标记为 mutual_exclusion → 必须等 stage-02 完成后启动
#   stage-02 和 stage-04 可在同一批次并行启动 2 个 AutoRunner worktree
