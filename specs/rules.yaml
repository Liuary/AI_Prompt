# ============================================================================
# AI_Prompt 规则 DSL Schema v1.0
#
# 本文件定义 AI Agent 行为约束的结构化描述格式。
# 将 AGENTS.md / dev_core.md / Instructions 中的自然语言约束
# 编码为机器可处理的结构化规则，支持编译（→ 各工具原生格式）
# 和校验（冲突/冗余/死规则检测）。
# ============================================================================

# 元信息
meta:
  schema: "ai-prompt-rule-dsl"
  version: "1.0.0"
  description: >
    AI Agent 行为约束的结构化定义格式。
     每条规则包含 9 个字段，覆盖规则的标识、级别、
    适用范围、触发条件、行为要求、执行模式、理由和来源。

# ── 规则字段定义 ──────────────────────────────────────────────

rule_fields:

  # 1. 唯一标识符
  id:
    type: string
    required: true
    pattern: "^[A-Z]{2,6}-\\d{3}$"
    description: >
      规则唯一标识符。
      格式：分类前缀（2-6 个大写字母）- 三位数字编号。
      分类前缀约定：
        CORE   — 核心行为约束（AGENTS.md § 核心约束）
        BEH    — 行为准则（AGENTS.md § 行为准则）
        STYLE  — 编码风格约束（AGENTS.md § 编码风格）
        OPS    — 操作规范（AGENTS.md § 操作规范）
        CMT    — 注释规范（AGENTS.md § 注释规范）
        META   — 元规则/体系规则（AGENTS.md § 动态规则 / 写入规范 / 知识库）
        DEV    — 开发期动态规则（dev_core.md）
        INST   — Instructions 操作规则（Kilo/Instructions/）
    examples:
      - "CORE-001"
      - "STYLE-003"
      - "DEV-001"

  # 2. 严重级别
  level:
    type: enum
    required: true
    values:
      - error     # 必须遵守；违反导致严重问题，校验器报错
      - warning   # 应当遵守；违反需在日志中说明理由，校验器告警
      - info      # 建议遵守；可根据实际情况灵活调整，校验器静默
    description: >
      规则严重级别，决定校验时的处理方式。
      error 级规则在编译器输出中以最高优先级呈现。

  # 3. 适用范围
  scope:
    type: enum
    required: true
    values:
      - all            # 所有 Agent 活动
      - conversation   # 对话交互行为（分析需求、回馈理解、展示选项）
      - code           # 代码编写行为（新增、修改、重构代码）
      - docs           # 文档编写行为（注释、README、API 文档、知识库）
      - workflow       # 工作流操作（文件管理、git、构建、日志、计划更新）
    description: >
      规则适用的 Agent 活动范围。
      编译器根据 scope 决定规则注入到哪个指令段落。

  # 4. 触发条件
  condition:
    type: string
    required: true
    description: >
      触发规则的条件或场景，使用自然语言描述。
      可包含 when/if/always 等关键词明确触发时机。
      对于始终生效的规则，填写 "always"。
      对于元规则（影响其他规则的优先级规则），在此明确覆盖关系。

  # 5. 行为要求
  action:
    type: string
    required: true
    description: >
      满足 condition 时 Agent 必须/应当/建议执行的行为。
      使用自然语言描述。关键词约定：
        must    — 强制行为（对应 enforcement: strict）
        should  — 推荐行为（对应 enforcement: advisory）
        may     — 可选行为（对应 enforcement: advisory 或 auto）
      多行为时用分号分隔。

  # 6. 执行模式
  enforcement:
    type: enum
    required: true
    values:
      - strict      # 严格：Agent 必须遵循，编译器直接注入为指令
      - advisory    # 建议：Agent 应主动提醒用户，由用户决定是否执行
      - auto        # 自动：可在满足条件时自动执行（如格式化、自检、知识库写入）
    description: >
      规则执行模式，决定编译器输出格式和 Agent 运行时行为。
      strict 规则在编译输出中使用 MUST 强调。
      advisory 规则在编译输出中使用 SHOULD。
      auto 规则编译器生成对应的自动化触发逻辑。

  # 7. 存在理由
  rationale:
    type: string
    required: true
    description: >
      规则存在的理由和背景。
      帮助 Agent 理解「为什么需要此规则」，而非机械执行。
      在规则冲突时（参见 CORE-006 元规则），此为判断优先级的重要依据。

  # 8. 来源追溯
  source:
    type: string
    required: true
    description: >
      规则来源文件的路径和章节，支持溯源审查。
      格式："{file} § {section}" 或 "{file} § {section}.{subsection}"
    examples:
      - "AGENTS.md § 核心约束.1"
      - "dev_core.md § 研究文档规范"
      - "instructions/core.md § 会话启动自检"

  # 9. 规则关系
  relations:
    type: array
    required: false
    description: >
      本规则与其他规则的关联关系，供校验器做结构化检测。
      不填写时校验器回退到自然语言解析（按关系章节的 detected_by 规则）。
    items:
      type: object
      fields:
        type:
          type: enum
          values: ["hierarchy", "dependency", "conflict", "redundancy"]
          description: "关系类型，对应关系章节的 types 定义"
        target:
          type: string
          pattern: "^[A-Z]{2,6}-\\d{3}$"
          description: "目标规则 ID"
        description:
          type: string
          description: "关系说明"
    examples:
      - type: hierarchy
        target: "CORE-001"
        description: "CORE-006（元规则）优先级高于 CORE-001"

# ── 规则间关系 ──────────────────────────────────────────────────

relations:
  description: >
    规则之间可能存在的关系，供校验器检测。
  types:
    - hierarchy:     # 优先级覆盖（如 CORE-006 覆盖所有其他规则）
        description: "一条规则声明优先级高于另一条，冲突时以此为准"
        detected_by: "condition 字段中提及其他规则 ID"
    - dependency:    # 规则 A 的有效性依赖规则 B
        description: "一条规则的 enforce 需要另一条规则先满足"
        detected_by: "rationale 字段中提及其他规则 ID"
    - conflict:      # 两条规则在同一条件下要求不同行为
        description: "同一 scope + condition 下两个 action 矛盾"
        detected_by: "校验器按 scope + condition 分组后对比 action"
    - redundancy:    # 两条规则的 action 和 scope 高度重合
        description: "规则 A 的约束完全被规则 B 覆盖"
        detected_by: "校验器计算规则对的 Jaccard 相似度"
