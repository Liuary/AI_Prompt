# ============================================================================
# AI_Prompt Rule DSL Schema v1.0
#
# Structured description format for AI Agent behavior constraints.
# Encodes natural language constraints from AGENTS.md / dev_core.md / Instructions
# into machine-processable structured rules, supporting compilation (→ native tool formats)
# and validation (conflict / redundancy / dead-rule detection).
# ============================================================================

# Meta
meta:
  schema: "ai-prompt-rule-dsl"
  version: "1.0.0"
  description: >
    Structured definition format for AI Agent behavior constraints.
    Each rule contains 9 fields covering identification, severity,
    scope, trigger condition, behavior requirement, enforcement mode,
    rationale, and source.

# ─── Rule Field Definitions ─────────────────────────────────────────────────

rule_fields:

  # 1. Unique Identifier
  id:
    type: string
    required: true
    pattern: "^[A-Z]{2,6}-\\d{3}$"
    description: >
      Rule unique identifier.
      Format: category prefix (2-6 uppercase letters) - three-digit number.
      Category prefixes:
        CORE    — core behavior constraints (AGENTS.md § Core Constraints)
        BEH     — behavior guidelines (AGENTS.md § Behavior Guidelines)
        STYLE   — coding style constraints (AGENTS.md § Coding Style)
        OPS     — operational norms (AGENTS.md § Operational Norms)
        CMT     — comment norms (AGENTS.md § Comment Norms)
        META    — meta-rules / system rules (AGENTS.md § Dynamic Rules / Writing Norms / Knowledge Base)
        DEV     — development dynamic rules (dev_core.md)
        INST    — Instructions operational rules (instructions/)
    examples:
      - "CORE-001"
      - "STYLE-003"
      - "DEV-001"

  # 2. Severity Level
  level:
    type: enum
    required: true
    values:
      - error     # Must comply; violation leads to serious issues, validator reports error
      - warning   # Should comply; violation requires logging reason, validator warns
      - info      # Recommended; flexible adjustment based on circumstances, validator silent
    description: >
      Rule severity level, determines validator handling behavior.
      Error-level rules appear with highest priority in compiler output.

  # 3. Scope
  scope:
    type: enum
    required: true
    values:
      - all            # All Agent activities
      - conversation   # Conversation interaction behavior (requirement analysis, feedback understanding, presenting options)
      - code           # Code writing behavior (creation, modification, refactoring)
      - docs           # Documentation writing behavior (comments, README, API docs, knowledge base)
      - workflow       # Workflow operations (file management, git, builds, logs, plan updates)
    description: >
      Applicable scope of the rule.
      The compiler determines which instruction segment to inject the rule into based on scope.

  # 4. Trigger Condition
  condition:
    type: string
    required: true
    description: >
      Conditions or scenarios that trigger this rule, described in natural language.
      May include keywords such as when/if/always to clarify trigger timing.
      For always-effective rules, fill "always".
      For meta-rules (priority rules affecting other rules), specify override relationships here.

  # 5. Action
  action:
    type: string
    required: true
    description: >
      The behavior that the Agent must/should/may execute when condition is met.
      Described in natural language. Keyword conventions:
        must     — mandatory behavior (corresponds to enforcement: strict)
        should   — recommended behavior (corresponds to enforcement: advisory)
        may      — optional behavior (corresponds to enforcement: advisory or auto)
      Multiple actions separated by semicolons.

  # 6. Enforcement Mode
  enforcement:
    type: enum
    required: true
    values:
      - strict      # Strict: Agent must comply, compiler directly injects as instruction
      - advisory    # Advisory: Agent should proactively remind user, user decides whether to execute
      - auto        # Auto: may execute automatically when conditions are met (formatting, self-check, knowledge base writing)
    description: >
      Rule enforcement mode, determines compiler output format and Agent runtime behavior.
      Strict rules use MUST emphasis in compiler output.
      Advisory rules use SHOULD in compiler output.
      Auto rules generate corresponding automated trigger logic.

  # 7. Rationale
  rationale:
    type: string
    required: true
    description: >
      Reason and background for the rule's existence.
      Helps Agent understand "why this rule is needed" rather than mechanical execution.
      When rules conflict (see CORE-006 meta-rule), this is an important basis for determining priority.

  # 8. Source
  source:
    type: string
    required: true
    description: >
      Path and section of the rule's source document, supporting source tracing.
      Format: "{file} § {section}" or "{file} § {section}.{subsection}"
    examples:
      - "AGENTS.md § Core Constraints.1"
      - "dev_core.md § Research Document Norms"
      - "instructions/core.md § Session Startup Self-Check"

  # 9. Relations
  relations:
    type: array
    required: false
    description: >
      This rule's relationships with other rules, for validator structural detection.
      When not filled, validator falls back to natural language parsing
      (according to the relationship chapter's detected_by rules).
    items:
      type: object
      fields:
        type:
          type: enum
          values: ["hierarchy", "dependency", "conflict", "redundancy"]
          description: "Relationship type, corresponding to the types definition in the relationship chapter"
        target:
          type: string
          pattern: "^[A-Z]{2,6}-\\d{3}$"
          description: "Target rule ID"
        description:
          type: string
          description: "Relationship description"
    examples:
      - type: hierarchy
        target: "CORE-001"
        description: "CORE-006 (meta-rule) has higher priority than CORE-001"

# ─── Rule Relations ─────────────────────────────────────────────────────────

relations:
  description: >
    Possible relationships between rules, for validator detection.
  types:
    - hierarchy:     # Priority override (e.g. CORE-006 overrides all other rules)
        description: "One rule declares higher priority than another; this takes precedence on conflict"
        detected_by: "condition field mentions other rule IDs"
    - dependency:    # Rule A's validity depends on Rule B
        description: "One rule's enforcement requires another rule to be satisfied first"
        detected_by: "rationale field mentions other rule IDs"
    - conflict:      # Two rules require different actions under the same condition
        description: "Two actions conflict under the same scope + condition"
        detected_by: "Validator groups by scope + condition then compares actions"
    - redundancy:    # Rule A and Rule B's action and scope highly overlap
        description: "Rule A's constraint is completely covered by Rule B"
        detected_by: "Validator calculates Jaccard similarity of rule pairs"
