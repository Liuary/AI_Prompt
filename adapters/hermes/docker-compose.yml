# Hermes-3 local deployment docker-compose config
# Uses Ollama container to deploy Hermes-3 model with function calling support.
#
# Start: docker-compose -f adapters/hermes/docker-compose.yml up -d
# Verify: python scripts/verify_hermes.py

version: "3.8"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: hermes-ollama
    ports:
      - "11434:11434"
    volumes:
      # Persist model data
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_KEEP_ALIVE=24h
    restart: unless-stopped
#    deploy:
#      resources:
#        reservations:
#          devices:
            # GPU acceleration (for NVIDIA GPU)
#            - driver: nvidia
#              count: 1
#              capabilities: [gpu]

  # Open WebUI — optional, provides web interface for model management
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: hermes-webui
    ports:
      - "3000:8080"
    volumes:
      - open-webui_data:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    restart: unless-stopped
    depends_on:
      - ollama

volumes:
  ollama_data:
    driver: local
  open-webui_data:
    driver: local
