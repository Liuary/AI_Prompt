# ============================================================================
# AI_Prompt 规则实例
#
# 遵循 specs/rules.yaml 中定义的 DSL Schema v1.0。
# 将 AGENTS.md 核心约束和 dev_core.md 规则编码为结构化 YAML。
# ============================================================================

meta:
  schema: "ai-prompt-rule-dsl"
  version: "1.0.0"
  generated: "2026-05-13T01:35+08:00"
  language_policy: >
    condition 和 action 字段使用中文描述（与 AGENTS.md 源文件语言一致），
    编译器在输出到各工具原生格式时根据目标文件语言自动转换。

# ── 规则列表 ──────────────────────────────────────────────────

rules:

  # ═══ AGENTS.md § 核心约束 ═══════════════════════════════════

  - id: "CORE-001"
    level: error
    scope: conversation
    condition: >
      当用户提出需求时触发。若需求极其简单且不存在歧义（如查询当前时间、简单计算等），
      可跳过确认直接执行，但仍需简要说明理解。
    action: >
      must 先分析拆解需求，将理解列点回馈给用户确认；
      must 分析过程中遇到不确定的内容及时提问，避免推测性假设
    enforcement: strict
    rationale: >
      防止理解偏差导致错误实现。先确认理解再动手，减少返工。
      例外：需求极其简单且不存在歧义时可跳过确认，但仍需简要说明理解。
    source: "AGENTS.md § 核心约束.1"
    relations:
      - type: conflict
        target: "CORE-004"
        description: "CORE-001 要求分析确认→可跳过简单需求，CORE-004 要求多步骤时列出方案，两者在简单需求判断上可能重叠"

  - id: "CORE-002"
    level: warning
    scope: code
    condition: >
      设计方案时触发。以下任一情况视为可能过度设计，必须与用户沟通：
      (1) 新增或修改的文件超过 3 个；
      (2) 引入新的抽象层（基类、中间件、设计模式）但无明显复用需求；
      (3) 为单一功能引入第三方库或框架；
      (4) 计划中包含过多未来扩展点（基于当前尚未确认的需求）。
      若用户明确要求简洁实现，以上阈值自动降低。
    action: >
      must 与用户沟通确认后再继续；
      must 在设计前判断是否触及以上阈值
    enforcement: strict
    rationale: >
      避免过度设计，保持代码简洁。4 个量化阈值帮助 Agent 自我判断是否越界。
      用户明确要求简洁实现时阈值自动降低。
    source: "AGENTS.md § 核心约束.2"
    relations:
      - type: conflict
        target: "CORE-003"
        description: "CORE-002 限制修改文件数≤3，CORE-003 控制修改范围但允许告知后小重构，两者在文件数阈值上需协同判断"

  - id: "CORE-003"
    level: warning
    scope: code
    condition: "修改代码时触发（适用于所有代码变更，不论范围大小）"
    action: >
      must 严格控制修改范围，避免修改与当前需求无直接关系的既有代码（即使在同一文件或相邻逻辑块中）；
      must 小规模重构（重命名变量、提取方法）前告知用户原因和影响范围；
      must 大规模重构或架构变更前取得用户明确同意；
      should 整体开发遵循已制定的开发规划，避免局部频繁、零散的修改破坏一致性
    enforcement: strict
    rationale: >
      防止修改蔓延和意外副作用。小重构允许但需告知，大重构必须审批。
      遵循开发规划保证整体一致性。
    source: "AGENTS.md § 核心约束.3"
    relations:
      - type: conflict
        target: "CORE-002"
        description: "CORE-002 限制修改文件数≤3，CORE-003 控制修改范围但允许告知后小重构，两者在文件数阈值上需协同判断"

  - id: "CORE-004"
    level: error
    scope: conversation
    condition: >
      当需求包含多步骤操作、存在多种同等合理的技术方案，或需求本身较为模糊时触发
    action: >
      must 主动列出可选方案及各自的优劣，让用户进行选择确认；
      must 禁止在未取得用户确认的情况下直接选择实施路径
    enforcement: strict
    rationale: >
      确保用户在技术方案选择上的主导权。Agent 提供分析和建议，用户做决策。
      禁止 Agent 替用户做技术选型。
    source: "AGENTS.md § 核心约束.4"
    relations:
      - type: conflict
        target: "CORE-001"
        description: "CORE-004 要求多方案选择，CORE-001 允许简单需求跳过确认，两者需在需求复杂度判断上协调"

  - id: "CORE-005"
    level: error
    scope: workflow
    condition: "完成代码修改后触发"
    action: >
      must 及时运行相关测试，验证功能正确性并确认未引入回归问题；
      must 测试未通过前不得声称任务完成，必须先排查并修复失败用例；
      should 若项目缺少测试框架或测试用例，主动向用户建议补充
    enforcement: strict
    rationale: >
      确保代码质量和防止回归。测试是代码修改完成与否的硬性标准。
      无测试框架时应主动建议补充。
    source: "AGENTS.md § 核心约束.5"
    relations: []

  - id: "CORE-006"
    level: error
    scope: all
    condition: >
      当以上约束彼此冲突，或约束与用户明确指令冲突时触发。
      另外：当 Agent 发现自身已违反某条规则时，应立即说明并纠正。
    action: >
      优先级顺序：用户明确指令 > 安全性/数据完整性 > 本文件中的其他约束；
      must 向用户报告冲突点及采取的仲裁策略
    enforcement: strict
    rationale: >
      元规则，为所有约束提供冲突解决优先级。确保用户指令始终最高优先，
      安全性次之，其他约束可被覆盖。Agent 自我纠错机制。
    source: "AGENTS.md § 核心约束.6"
    relations:
      - type: hierarchy
        target: "CORE-001"
        description: "CORE-006（元规则）优先级高于 CORE-001，冲突时用户指令优先"
      - type: hierarchy
        target: "CORE-002"
        description: "CORE-006（元规则）优先级高于 CORE-002，用户明确要求简洁实现时阈值降低"
      - type: hierarchy
        target: "CORE-003"
        description: "CORE-006（元规则）优先级高于 CORE-003，用户明确允许时可扩大修改范围"
      - type: hierarchy
        target: "CORE-004"
        description: "CORE-006（元规则）优先级高于 CORE-004，用户直接指定方案时跳过选项列出"
      - type: hierarchy
        target: "CORE-005"
        description: "CORE-006（元规则）优先级高于 CORE-005，用户明确跳过测试时可不运行"

  # ═══ dev_core.md § 研究文档规范 ══════════════════════════════

  - id: "DEV-001"
    level: warning
    scope: docs
    condition: "创建研究或分析类文档时触发"
    action: >
      must 将文档放入 docs/research/ 目录，按主题命名；
      must 文档内容以可验证的公开信息为基础，禁止编造数据或虚构引用；
      must 文档末尾标注撰写时间与核心参考来源
    enforcement: strict
    rationale: >
      统一研究文档存放位置和格式规范。确保研究分析的可信度，
      防止 AI 生成不可验证的虚假内容混入项目文档。
    source: "dev_core.md § 研究文档规范"
    relations: []
